name: Daily GitHub Radar Pipeline

on:
  schedule:
    # 每天 UTC 0:00 (北京时间上午 8:00) 自动触发
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持在 GitHub 控制台手动一键触发

permissions:
  contents: write

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Radar Pipeline
        env:
          # 优先使用用户配置在 Secrets 中的 GITHUB_TOKEN，默认回退到 GITHUB 内置 Actions Token
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          python main.py

      - name: Commit and Push Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ docs/ index.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(radar): update daily intelligence and dashboard [$(date -u +'%Y-%m-%d')]"
            git push
          fi
